services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: serps
      POSTGRES_PASSWORD: ${SERPS_POSTGRES_PASSWORD:?Set SERPS_POSTGRES_PASSWORD}
      POSTGRES_DB: serps_pop
    volumes:
      - serps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serps -d serps_pop"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: serps-api:${SERPS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      SERPS_ENV: ${SERPS_ENV:-production}
      SERPS_DATABASE_URL: ${SERPS_DATABASE_URL:?Set SERPS_DATABASE_URL with host db}
      SERPS_JWT_SECRET: ${SERPS_JWT_SECRET:?Set SERPS_JWT_SECRET}
      SERPS_JWT_ISSUER: ${SERPS_JWT_ISSUER:-serps-pop}
      SERPS_JWT_AUDIENCE: ${SERPS_JWT_AUDIENCE:-serps-api}
      SERPS_ACCESS_TOKEN_MINUTES: ${SERPS_ACCESS_TOKEN_MINUTES:-10}
      SERPS_REFRESH_TOKEN_DAYS: ${SERPS_REFRESH_TOKEN_DAYS:-7}
      SERPS_CORS_ORIGINS: ${SERPS_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${SERPS_BIND_ADDRESS:-127.0.0.1}:${SERPS_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s

  web:
    image: serps-web:${SERPS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${SERPS_BIND_ADDRESS:-127.0.0.1}:${SERPS_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

volumes:
  serps_postgres_data:
