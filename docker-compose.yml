services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: serps
      POSTGRES_PASSWORD: serps
      POSTGRES_DB: serps_pop
    ports:
      - "5432:5432"
    volumes:
      - serps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serps -d serps_pop"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      SERPS_DATABASE_URL: postgresql+psycopg://serps:serps@db:5432/serps_pop
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  serps_postgres_data:
