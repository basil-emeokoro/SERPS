<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc"><title id="title">SERPS historical recovery evidence and governance architecture</title><desc id="desc">Local browser observations produce structured evidence. The API authenticates and authorizes requests, persists evidence, computes contextual assessments, recommendations and institutional policy evaluations, and exposes them to human reviewers and audit reports. This diagram describes code structure, not screenshot-proven runtime acceptance.</desc><rect width="1100" height="510" rx="18" fill="#eef8f8"/><g font-family="Segoe UI,Arial,sans-serif" fill="#082f3b"><text x="35" y="48" font-size="25" font-weight="700">From observations to accountable review</text><text x="35" y="80" font-size="17">Historical recovery architecture - not a live evaluation or acceptance result</text><g fill="#ffffff" stroke="#247582" stroke-width="2"><rect x="35" y="115" width="310" height="115" rx="12"/><rect x="395" y="115" width="310" height="115" rx="12"/><rect x="755" y="115" width="310" height="115" rx="12"/><rect x="35" y="290" width="310" height="115" rx="12"/><rect x="395" y="290" width="310" height="115" rx="12"/><rect x="755" y="290" width="310" height="115" rx="12"/></g><g font-size="21" font-weight="700"><text x="55" y="150">Browser observations</text><text x="415" y="150">Authenticated evidence API</text><text x="775" y="150">CIE + recommendation</text><text x="55" y="325">IPIME Policy-as-Code</text><text x="415" y="325">Human review</text><text x="775" y="325">Audit + reports</text></g><g font-size="17"><text x="55" y="185">Local object / face / audio activity</text><text x="55" y="211">Ordered metadata outbox</text><text x="415" y="185">Ownership + institutional gates</text><text x="415" y="211">Atomic delivery identity</text><text x="775" y="185">Context, confidence, explanation</text><text x="775" y="211">Bounded advisory output</text><text x="55" y="360">Institutional policy evaluation</text><text x="55" y="386">Operational protection limits apply</text><text x="415" y="360">Authorized decision + rationale</text><text x="415" y="386">No autonomous misconduct verdict</text><text x="775" y="360">Persisted structured records</text><text x="775" y="386">No remote raw-media feed</text></g><text x="35" y="465" font-size="17">Flow: observations - evidence - CIE - IPIME - human review - audit. Exam Protect: unresolved Issue #2.</text></g><g stroke="#247582" stroke-width="3" fill="none"><path d="M345 172h40m-9-7 9 7-9 7M705 172h40m-9-7 9 7-9 7M345 347h40m-9-7 9 7-9 7M705 347h40m-9-7 9 7-9 7"/></g></svg>